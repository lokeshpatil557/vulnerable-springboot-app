# =====================================================================
# OWASP VULNERABILITY LEARNING LAB - FIXED VERSION
# Secrets are now externalized and not committed to source control
# =====================================================================

# Application
spring.application.name=vulnerable-spring-app
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:h2:mem:owaspdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# FIXED: Secrets are now loaded from environment variables
# In production, use Spring Cloud Config, Vault, or environment variables
# Example: export APP_SECRET_API_KEY="your-secure-api-key"
# The SecretConfig.java uses @Value annotations to inject these

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# FIXED: Logging is reduced to avoid information disclosure
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=WARN
