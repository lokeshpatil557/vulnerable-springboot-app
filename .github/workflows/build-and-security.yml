name: Build & Security (NVIDIA CI pipeline)

on:
  push:
    branches:
      - nvdia_trials
  pull_request:
    branches:
      - nvdia_trials
  workflow_dispatch:

permissions:
  contents: write

env:
  NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1/chat/completions
  NVIDIA_MODEL: meta/llama-3.1-70b-instruct
  NVIDIA_TEMPERATURE: "0.0"
  NVIDIA_MAX_TOKENS: "8192"

jobs:
  build:
    name: Build (Maven)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & test (skip tests on this intentionally insecure lab)
        run: mvn -B -ntp -DskipTests package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      REPORTS_DIR: .claude/reports
      ASSESSMENT_REPORT: .claude/reports/SECURITY_ASSESSMENT_REPORT.md
      PUSH_REPORT: .claude/reports/GIT_PUSH_REPORT.md

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ensure reports dir exists
        run: mkdir -p "$REPORTS_DIR"

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install curl + jq (already on ubuntu-latest, but be explicit)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq >/dev/null
          curl --version | head -n1
          jq --version

      # -----------------------------------------------------------
      # NVIDIA vulnerability scanner — chained, validated orchestrator.
      #
      #   Generation order (NOT the same as display order):
      #     1. Vulnerability Findings   — generated FIRST, no deps.
      #        This is the only section allowed to invent VULN-IDs.
      #     2. Parse real IDs           — local awk/grep on (1)'s
      #        output. NOT an API call. Produces PARSED_LIST (a few
      #        lines: ID | CWE | OWASP category | severity) and
      #        severity counts.
      #     3. Risk Matrix, OWASP Mapping, CWE Mapping, Remediation
      #        Roadmap — each generated with PARSED_LIST injected
      #        into the prompt. Output is validated: any VULN-ID it
      #        references that isn't in PARSED_LIST triggers a
      #        rejection + retry with feedback.
      #     4. Executive Summary        — generated LAST, given the
      #        real severity counts computed from PARSED_LIST (not
      #        asked of the model), so its numbers match Findings.
      #
      #   Every section call also gets:
      #     - finish_reason check (truncation ("length") is never
      #       accepted; the model is asked to continue, not restart)
      #     - strict ~~~~markdown fence extraction (a missing/broken
      #       fence is a retryable failure, never a raw-text fallback)
      #     - cross-section leakage check (rejects a block containing
      #       another section's "# Heading")
      #     - retries carry a failure_note describing what was wrong,
      #       and nudge temperature up slightly, so a retry at
      #       temp=0 isn't just a repeat of the same broken output
      #
      #   Final stitching still uses the ORIGINAL display order:
      #   Executive Summary → Risk Matrix → Vulnerability Findings →
      #   OWASP Mapping → CWE Mapping → Remediation Roadmap.
      # -----------------------------------------------------------
      - name: nvidia-scan
        id: nvidia_scan
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SYSTEM_PROMPT_FILE: .claude/agents/nvidia-vulnerability-scanner.md
          MAX_SECTION_RETRIES: "3"
          MAX_CONTINUATIONS: "3"
          MIN_SECTION_WORDS: "15"
        run: |
          set -uo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::warning::NVIDIA_API_KEY repository secret is not set. Writing a placeholder report instead of failing the job."
            mkdir -p "$(dirname "$ASSESSMENT_REPORT")"
            {
              echo "# SECURITY ASSESSMENT REPORT"
              echo
              echo "_NVIDIA_API_KEY was not set, so no automated scan could run. Add the secret and re-run this workflow._"
              for h in "Executive Summary" "Risk Matrix" "Vulnerability Findings" \
                       "OWASP Top 10 Mapping" "CWE Mapping" "Priority Remediation Roadmap"; do
                echo
                echo "# $h"
                echo
                echo "_Not generated — NVIDIA_API_KEY missing._"
              done
            } > "$ASSESSMENT_REPORT"
            echo "Wrote placeholder $ASSESSMENT_REPORT."
            exit 0
          fi

          # ------------------------------------------------------------
          # 1. Shared input payload — curated high-signal files, same
          #    approach as before (pom.xml, security/config classes,
          #    controllers/services/repos, templates), capped per file.
          # ------------------------------------------------------------
          USER_PAYLOAD=$(mktemp)
          {
            echo "## Repository tree (paths only, capped at 400 entries)"
            (find . -type f \
              -not -path './target/*' \
              -not -path './.git/*' \
              -not -path './.claude/reports/*' \
              -not -path './node_modules/*' \
              | sort | head -n 400) || true
            echo
            echo "## File contents (curated — high-signal files only)"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              [ ! -f "$f" ] && continue
              size=$(wc -c < "$f" 2>/dev/null || echo 0)
              echo
              echo "### $f (${size} bytes)"
              if [ "$size" -gt 16000 ]; then
                head -c 16000 "$f"
                echo
                echo "...FILE TRUNCATED at 16000 bytes..."
              else
                cat "$f"
              fi
            done < <(
              printf '%s\n' pom.xml
              find src/main/resources -type f \
                \( -name 'application*.yml' \
                   -o -name 'application*.yaml' \
                   -o -name 'application*.properties' \) 2>/dev/null || true
              find src -type f -name '*.java' \
                \( -iname '*Security*' -o -iname '*Auth*' -o -iname '*Filter*' \
                   -o -iname '*Config*' -o -iname '*Cors*' -o -iname '*Web*' \
                   -o -iname '*User*' -o -iname '*Login*' -o -iname '*Token*' \
                   -o -iname '*Jwt*' \) 2>/dev/null || true
              find src -type f -name '*.java' \
                \( -path '*/controller/*' -o -path '*/controllers/*' \
                   -o -path '*/service/*' -o -path '*/services/*' \
                   -o -path '*/repository/*' -o -path '*/repositories/*' \
                   -o -path '*/dao/*' -o -path '*/model/*' -o -path '*/entity/*' \
                   -o -path '*/dto/*' -o -path '*/util/*' -o -path '*/utils/*' \) 2>/dev/null || true
              find src -type f \
                \( -name '*.html' -o -name '*.jsp' -o -name '*.tpl' \) 2>/dev/null || true
            ) | sort -u
          } > "$USER_PAYLOAD"

          SYSTEM_PROMPT=$(cat "$SYSTEM_PROMPT_FILE")

          echo "=== NVIDIA SCAN: Preparing request ==="
          echo "Payload size: $(wc -c < "$USER_PAYLOAD") bytes"
          echo "Model: $NVIDIA_MODEL"

          # ------------------------------------------------------------
          # 2. Helper: strict fence extraction (preferred path).
          # ------------------------------------------------------------
          extract_block() {
            awk '
              /^~~~~[Mm]arkdown[[:space:]]*$/ { if (!in_block) {in_block=1; found=1; next} }
              /^~~~~[[:space:]]*$/            { if (in_block) {in_block=0; exit} }
              in_block { print }
              END { if (!found) exit 1 }
            '
          }

          # Lenient fallback: try triple-backtick fence, else strip obvious
          # chat preamble/postamble around the first '#' heading, else
          # return the raw text as-is. Always outputs SOMETHING non-empty
          # if the input has any non-whitespace content — this is the
          # safety net so a section is never dropped entirely.
          extract_lenient() {
            local raw="$1"
            local out
            out=$(printf '%s' "$raw" | awk '
              /^```[Mm]arkdown[[:space:]]*$/ { if (!in_block) {in_block=1; found=1; next} }
              /^```[[:space:]]*$/            { if (in_block) {in_block=0; exit} }
              in_block { print }
              END { if (!found) exit 1 }
            ')
            if [ -n "$out" ]; then printf '%s' "$out"; return 0; fi

            out=$(printf '%s' "$raw" | awk '
              /^# / && !started { started=1 }
              started { print }
            ')
            if [ -n "$out" ]; then printf '%s' "$out"; return 0; fi

            printf '%s' "$raw"
          }

          contains_other_heading() {
            local block="$1" own="$2"; shift 2
            for h in "$@"; do
              [ "$h" = "$own" ] && continue
              if printf '%s\n' "$block" | grep -q "^# ${h}"; then
                return 0
              fi
            done
            return 1
          }

          # call_nvidia never aborts the caller — on failure it sets
          # ASSISTANT="" and FINISH_REASON="error" and returns 1, so the
          # retry loop treats it exactly like a bad/empty response.
          call_nvidia() {
            local user_msg="$1" temp="$2"
            local REQUEST_BODY RESPONSE_FILE HTTP_CODE
            REQUEST_BODY=$(jq -n \
              --arg model "$NVIDIA_MODEL" --arg sys "$SYSTEM_PROMPT" --arg user "$user_msg" \
              --argjson temp "$temp" --argjson mtok "$NVIDIA_MAX_TOKENS" \
              '{model:$model, temperature:$temp, max_tokens:$mtok,
                messages:[{role:"system",content:$sys},{role:"user",content:$user}]}')
            RESPONSE_FILE=$(mktemp)
            HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
              -H "Authorization: Bearer $NVIDIA_API_KEY" -H "Content-Type: application/json" \
              --connect-timeout 60 --max-time 1200 \
              --retry 5 --retry-delay 15 --retry-all-errors --retry-max-time 900 \
              -X POST "$NVIDIA_BASE_URL" -d "$REQUEST_BODY" || echo "000")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::NVIDIA call HTTP $HTTP_CODE — will retry, not aborting."
              cat "$RESPONSE_FILE" || true
              rm -f "$RESPONSE_FILE"
              ASSISTANT=""
              FINISH_REASON="error"
              return 1
            fi
            ASSISTANT=$(jq -r '.choices[0].message.content // ""' "$RESPONSE_FILE")
            FINISH_REASON=$(jq -r '.choices[0].finish_reason // ""' "$RESPONSE_FILE")
            rm -f "$RESPONSE_FILE"
            return 0
          }

          # ------------------------------------------------------------
          # 3. generate_section <id> <prompt_file> <report_file> <log>
          #                      <own_heading> <all_headings_csv>
          #                      [extra_context_text]
          #
          #    NEVER aborts the job and NEVER returns non-zero. It always
          #    appends *something* to report_file for this section:
          #      - a clean, validated block (normal path), or
          #      - a best-effort block via extract_lenient if strict
          #        validation keeps failing after MAX_SECTION_RETRIES
          #        attempts (marked DEGRADED in the report + logs), or
          #      - a short placeholder note if even that yields nothing
          #        (e.g. every API call failed).
          #    Sets GENERATED_BLOCK to whatever text was appended, and
          #    SECTION_DEGRADED=1 if this section used the fallback path
          #    (the caller can log/report on this; it does not fail CI).
          # ------------------------------------------------------------
          generate_section() {
            local section_id="$1" prompt_file="$2" report_file="$3" log_file="$4"
            local own_heading="$5" all_headings_csv="$6" extra_context="${7:-}"
            local attempt=0 temp="$NVIDIA_TEMPERATURE" failure_note=""
            local best_block="" best_len=0
            SECTION_DEGRADED=0

            while [ "$attempt" -lt "$MAX_SECTION_RETRIES" ]; do
              attempt=$((attempt + 1))
              echo "[$section_id] attempt $attempt/$MAX_SECTION_RETRIES (temp=$temp)"

              local base_msg
              base_msg="$(cat "$USER_PAYLOAD")

          ---
          ${extra_context}

          ## Section to produce NOW: ${section_id}

          $(cat "$prompt_file")

          ${failure_note}

          Emit ONLY this section, formatted as a single Markdown fenced code block.
          Use exactly four tilde characters for the OUTER fence:

          ~~~~markdown
          ...this section's content, with its '# <Section Name>' header...
          ~~~~

          No other sections. No preamble. No postamble. Stop after the closing fence."

              local raw_accum="" sub=0 msg="$base_msg" call_failed=0
              while [ "$sub" -lt "$MAX_CONTINUATIONS" ]; do
                sub=$((sub + 1))
                if ! call_nvidia "$msg" "$temp"; then
                  call_failed=1
                  break
                fi
                raw_accum+="$ASSISTANT"
                {
                  echo "=== $section_id attempt $attempt sub $sub (finish_reason=$FINISH_REASON) ==="
                  printf '%s\n' "$ASSISTANT" | head -c 2000
                  echo "--- END ---"
                } >> "$log_file"

                if [ "$FINISH_REASON" != "length" ]; then break; fi

                echo "[$section_id] truncated, requesting continuation ($sub/$MAX_CONTINUATIONS)"
                local tail_ctx
                tail_ctx=$(printf '%s' "$raw_accum" | tail -c 2000)
                msg="Continue the '${section_id}' section EXACTLY where you left off. Do not repeat any text.
          Here is the end of what you already wrote:

          ${tail_ctx}

          Continue from immediately after that. When complete, close with the ~~~~ fence."
              done

              # Always keep the longest raw text seen so far as a safety net,
              # even if this attempt ultimately fails validation.
              if [ "${#raw_accum}" -gt "$best_len" ]; then
                best_block="$raw_accum"
                best_len="${#raw_accum}"
              fi

              if [ "$call_failed" -eq 1 ]; then
                echo "::warning::[$section_id] API call failed on attempt $attempt; retrying."
                failure_note="NOTE: the previous request failed; try again."
                temp=$(awk -v t="$temp" 'BEGIN{printf "%.1f", (t+0.2>0.9)?0.9:t+0.2}')
                continue
              fi

              if [ "$FINISH_REASON" = "length" ]; then
                echo "::warning::[$section_id] still truncated after $MAX_CONTINUATIONS continuations; retrying."
                failure_note="NOTE: your previous attempt was truncated before completion. Be more concise per item so the full section fits."
                temp=$(awk -v t="$temp" 'BEGIN{printf "%.1f", (t+0.2>0.9)?0.9:t+0.2}')
                continue
              fi

              local BLOCK
              if ! BLOCK=$(printf '%s' "$raw_accum" | extract_block); then
                echo "::warning::[$section_id] no valid fence found; retrying."
                echo "::group::[$section_id] raw output (first 1500 chars) — for diagnosis"
                printf '%s\n' "$raw_accum" | head -c 1500
                echo
                echo "::endgroup::"
                failure_note="NOTE: your previous attempt did not wrap the section in the exact ~~~~markdown / ~~~~ fence. Do not use triple backticks. Start your reply with the literal line ~~~~markdown and end it with the literal line ~~~~ — nothing before or after."
                temp=$(awk -v t="$temp" 'BEGIN{printf "%.1f", (t+0.2>0.9)?0.9:t+0.2}')
                continue
              fi

              IFS=',' read -ra ALL_HEADINGS <<< "$all_headings_csv"
              if contains_other_heading "$BLOCK" "$own_heading" "${ALL_HEADINGS[@]}"; then
                echo "::warning::[$section_id] leaked another section's heading; retrying."
                failure_note="NOTE: your previous attempt included content belonging to a different section. Only output '${own_heading}'."
                temp=$(awk -v t="$temp" 'BEGIN{printf "%.1f", (t+0.2>0.9)?0.9:t+0.2}')
                continue
              fi

              # Grounding check — only applies when we gave the model a
              # PARSED_LIST to work from (i.e. not the Findings section itself).
              if [ -n "$extra_context" ] && [ -n "${PARSED_IDS:-}" ]; then
                local USED_IDS UNKNOWN_IDS
                USED_IDS=$(printf '%s' "$BLOCK" | grep -oE 'VULN-[0-9]+' | sort -u || true)
                UNKNOWN_IDS=$(comm -23 <(printf '%s\n' "$USED_IDS") <(printf '%s\n' "$PARSED_IDS" | sort -u) || true)
                if [ -n "$UNKNOWN_IDS" ]; then
                  echo "::warning::[$section_id] referenced unknown IDs: $(printf '%s' "$UNKNOWN_IDS" | tr '\n' ' ')"
                  failure_note="NOTE: you referenced VULN-IDs not in the provided findings list ($(printf '%s' "$UNKNOWN_IDS" | tr '\n' ' ')). Only use IDs from the list given to you."
                  temp=$(awk -v t="$temp" 'BEGIN{printf "%.1f", (t+0.2>0.9)?0.9:t+0.2}')
                  continue
                fi
              fi

              local wc_words
              wc_words=$(printf '%s' "$BLOCK" | wc -w)
              if [ "$wc_words" -lt "$MIN_SECTION_WORDS" ]; then
                echo "::warning::[$section_id] suspiciously short ($wc_words words); retrying."
                failure_note="NOTE: your previous attempt was too short/empty. Produce the full section with real content."
                temp=$(awk -v t="$temp" 'BEGIN{printf "%.1f", (t+0.2>0.9)?0.9:t+0.2}')
                continue
              fi

              {
                echo
                echo "<!-- BEGIN SECTION: $section_id -->"
                printf '%s\n' "$BLOCK"
                echo "<!-- END SECTION: $section_id -->"
                echo
              } >> "$report_file"

              GENERATED_BLOCK="$BLOCK"
              echo "[$section_id] OK — appended $(printf '%s' "$BLOCK" | wc -c) bytes on attempt $attempt"
              return 0
            done

            # ---- Exhausted all attempts: degrade gracefully, do NOT abort ----
            echo "::warning::[$section_id] exhausted $MAX_SECTION_RETRIES attempts; using best-effort fallback."
            SECTION_DEGRADED=1

            local FALLBACK
            if [ -n "$best_block" ]; then
              FALLBACK=$(extract_lenient "$best_block")
            else
              FALLBACK=""
            fi
            FALLBACK=$(printf '%s' "$FALLBACK" | tr -d '\000')

            if ! printf '%s' "$FALLBACK" | grep -q "^# ${own_heading}"; then
              FALLBACK="# ${own_heading}

          _This section could not be fully validated after ${MAX_SECTION_RETRIES} attempts and may be incomplete or unvalidated. Manual review recommended._

          ${FALLBACK}"
            fi

            {
              echo
              echo "<!-- BEGIN SECTION: $section_id (DEGRADED — best effort, not fully validated) -->"
              printf '%s\n' "$FALLBACK"
              echo "<!-- END SECTION: $section_id -->"
              echo
            } >> "$report_file"

            echo "$section_id" >> "$DEGRADED_LOG"
            GENERATED_BLOCK="$FALLBACK"
            echo "[$section_id] DEGRADED — appended $(printf '%s' "$FALLBACK" | wc -c) fallback bytes"
            return 0
          }

          # ------------------------------------------------------------
          # 4. Prompt files (unchanged content, same six sections).
          # ------------------------------------------------------------
          PROMPT_DIR=$(mktemp -d)
          cat > "$PROMPT_DIR/executive_summary.txt" <<'PROMPT_EOF'
          Produce the '# Executive Summary' section of SECURITY_ASSESSMENT_REPORT.md. Cover: (a) scope reviewed, (b) methodology (check categories from your system prompt actually applied), (c) one-paragraph risk posture, (d) finding counts by severity — USE THE EXACT COUNTS GIVEN TO YOU BELOW, do not recompute them. Do NOT list individual findings here.
          PROMPT_EOF

          cat > "$PROMPT_DIR/risk_matrix.txt" <<'PROMPT_EOF'
          Produce ONLY the '# Risk Matrix' section: a Markdown table, columns 'Severity' and 'Likelihood', rows for each combination. Populate counts using ONLY the VULN-IDs given to you below — do not invent additional findings. Add one sentence on methodology.
          PROMPT_EOF

          cat > "$PROMPT_DIR/vulnerability_findings.txt" <<'PROMPT_EOF'
          Produce ONLY the '# Vulnerability Findings' section. For EACH finding use this exact schema:

          ### VULN-<NNN> — <Vulnerability Name>

          - **CWE:** CWE-<id>
          - **OWASP Top 10:** <category, e.g. A01:2021 - Broken Access Control>
          - **Severity:** Critical | High | Medium | Low
          - **Affected File:** `<repo-relative path>`
          - **Affected Method / Class:** `<name>`
          - **Vulnerable Code:**
            ```java
            <verbatim snippet — copy-paste from the input>
            ```
          - **Root Cause:** <one sentence>
          - **Exploitation Scenario:** <one paragraph>
          - **Business Impact:** <one paragraph>
          - **Confidence:** High | Medium | Low

          Order Critical → High → Medium → Low. Number VULN-IDs sequentially starting at VULN-001. Do NOT include any other section.
          PROMPT_EOF

          cat > "$PROMPT_DIR/owasp_mapping.txt" <<'PROMPT_EOF'
          Produce ONLY the '# OWASP Top 10 Mapping' section: for each OWASP category present, list the category name and the VULN-IDs given to you below that map to it. Use ONLY those VULN-IDs — do not invent new ones. Do NOT include any other section.
          PROMPT_EOF

          cat > "$PROMPT_DIR/cwe_mapping.txt" <<'PROMPT_EOF'
          Produce ONLY the '# CWE Mapping' section: for each CWE present, list the CWE ID + name and the VULN-IDs given to you below that map to it. Use ONLY those VULN-IDs. Do NOT include any other section.
          PROMPT_EOF

          cat > "$PROMPT_DIR/remediation_roadmap.txt" <<'PROMPT_EOF'
          Produce ONLY the '# Priority Remediation Roadmap' section: ordered list (Critical → Low) of remediation steps, ONE PER VULN-ID GIVEN TO YOU BELOW — do not invent additional VULN-IDs. 1-3 sentence fix each. End with '## Next Steps' — top 3 actions. Do NOT include any other section.
          PROMPT_EOF

          # heading | slug
          SECTIONS_DISPLAY_ORDER=(
            "Executive Summary|executive_summary"
            "Risk Matrix|risk_matrix"
            "Vulnerability Findings|vulnerability_findings"
            "OWASP Top 10 Mapping|owasp_mapping"
            "CWE Mapping|cwe_mapping"
            "Priority Remediation Roadmap|remediation_roadmap"
          )
          ALL_HEADINGS_CSV=$(printf '%s\n' "${SECTIONS_DISPLAY_ORDER[@]}" | awk -F'|' '{printf "%s,", $1}' | sed 's/,$//')

          REPORT_PARTS=$(mktemp)
          SECTION_LOG=$(mktemp)
          DEGRADED_LOG=$(mktemp)

          # ------------------------------------------------------------
          # 5. GENERATION ORDER (differs from display order):
          #    Findings -> parse -> {Risk Matrix, OWASP, CWE, Roadmap}
          #    -> Executive Summary (last, uses real counts).
          # ------------------------------------------------------------

          echo "=== Step 1/3: Vulnerability Findings (source of truth) ==="
          generate_section "vulnerability_findings" "$PROMPT_DIR/vulnerability_findings.txt" \
                            "$REPORT_PARTS" "$SECTION_LOG" \
                            "Vulnerability Findings" "$ALL_HEADINGS_CSV" ""
          FINDINGS_BLOCK="$GENERATED_BLOCK"

          echo "=== Step 2/3: Parsing real IDs (local, no API call) ==="
          PARSED_LIST=$(printf '%s\n' "$FINDINGS_BLOCK" | awk '
            /^### VULN-[0-9]+/      { id=$2; sub(/^VULN-/,"",id); vid="VULN-"id }
            /\*\*CWE:\*\*/          { cwe=$0; sub(/.*\*\*CWE:\*\* */,"",cwe) }
            /\*\*OWASP Top 10:\*\*/ { owasp=$0; sub(/.*\*\*OWASP Top 10:\*\* */,"",owasp) }
            /\*\*Severity:\*\*/     { sev=$0; sub(/.*\*\*Severity:\*\* */,"",sev);
                                       print vid " | " cwe " | " owasp " | " sev }
          ')
          PARSED_IDS=$(printf '%s\n' "$FINDINGS_BLOCK" | grep -oE 'VULN-[0-9]+' | sort -u)
          CRIT=$(printf '%s\n' "$PARSED_LIST" | grep -ic 'Critical' || true)
          HIGH=$(printf '%s\n' "$PARSED_LIST" | grep -ic ' High' || true)
          MED=$(printf '%s\n' "$PARSED_LIST" | grep -ic 'Medium' || true)
          LOW=$(printf '%s\n' "$PARSED_LIST" | grep -ic ' Low' || true)
          echo "Parsed $(printf '%s\n' "$PARSED_IDS" | grep -c . || echo 0) findings — Critical:$CRIT High:$HIGH Medium:$MED Low:$LOW"

          MAPPING_CONTEXT="## Real findings to reference (use ONLY these VULN-IDs, do not invent more)
          Format: VULN-ID | CWE | OWASP category | Severity

          ${PARSED_LIST}"

          echo "=== Step 3/3: Dependent sections (grounded on parsed list) ==="
          for entry in "Risk Matrix|risk_matrix" "OWASP Top 10 Mapping|owasp_mapping" \
                       "CWE Mapping|cwe_mapping" "Priority Remediation Roadmap|remediation_roadmap"; do
            heading="${entry%%|*}"; slug="${entry##*|}"
            generate_section "$slug" "$PROMPT_DIR/${slug}.txt" "$REPORT_PARTS" "$SECTION_LOG" \
                              "$heading" "$ALL_HEADINGS_CSV" "$MAPPING_CONTEXT"
          done

          SUMMARY_CONTEXT="## Real finding counts (use these exact numbers, do not recompute)
          Critical: ${CRIT} | High: ${HIGH} | Medium: ${MED} | Low: ${LOW}
          Total findings: $(printf '%s\n' "$PARSED_IDS" | grep -c . || echo 0)"

          generate_section "executive_summary" "$PROMPT_DIR/executive_summary.txt" "$REPORT_PARTS" "$SECTION_LOG" \
                            "Executive Summary" "$ALL_HEADINGS_CSV" "$SUMMARY_CONTEXT"

          # Report which sections (if any) used the best-effort fallback.
          # This is informational only — it never fails the job.
          if [ -s "$DEGRADED_LOG" ]; then
            echo "::warning::Sections generated via best-effort fallback (see report for details): $(paste -sd ', ' "$DEGRADED_LOG")"
          else
            echo "All sections generated and validated cleanly."
          fi

          # ------------------------------------------------------------
          # 6. Stitch in ORIGINAL DISPLAY ORDER (unchanged from before).
          # ------------------------------------------------------------
          {
            echo "# SECURITY ASSESSMENT REPORT"
            echo
            echo "_Generated by the NVIDIA vulnerability scanner on $(date -u +%Y-%m-%dT%H:%M:%SZ)._"
            echo "_Model: ${NVIDIA_MODEL} (build.nvidia.com)._"
            echo
            echo "## Contents"
            echo
            echo "1. [Executive Summary](#executive-summary)"
            echo "2. [Risk Matrix](#risk-matrix)"
            echo "3. [Vulnerability Findings](#vulnerability-findings)"
            echo "4. [OWASP Top 10 Mapping](#owasp-top-10-mapping)"
            echo "5. [CWE Mapping](#cwe-mapping)"
            echo "6. [Priority Remediation Roadmap](#priority-remediation-roadmap)"
            echo

            for entry in "${SECTIONS_DISPLAY_ORDER[@]}"; do
              slug="${entry##*|}"
              awk -v marker="BEGIN SECTION: $slug" '
                $0 ~ marker {flag=1; next}
                /END SECTION:/ {flag=0}
                flag {print}
              ' "$REPORT_PARTS"
            done
          } > "$ASSESSMENT_REPORT"

          REPORT_BYTES=$(wc -c < "$ASSESSMENT_REPORT")
          echo "Report size: $REPORT_BYTES bytes"

          if [ "$REPORT_BYTES" -lt 200 ]; then
            echo "::warning::Assessment report suspiciously small ($REPORT_BYTES bytes) — writing a placeholder note instead of failing the job."
            echo "" >> "$ASSESSMENT_REPORT"
            echo "_Warning: the generated report was unexpectedly small. Check the nvidia-scan-transcript artifact for details._" >> "$ASSESSMENT_REPORT"
          fi
          for expected_heading in \
            "# Executive Summary" "# Risk Matrix" "# Vulnerability Findings" \
            "# OWASP Top 10 Mapping" "# CWE Mapping" "# Priority Remediation Roadmap"; do
            if ! grep -Fq "$expected_heading" "$ASSESSMENT_REPORT"; then
              echo "::warning::Assessment report missing heading '$expected_heading' — inserting placeholder instead of failing."
              {
                echo
                echo "$expected_heading"
                echo
                echo "_This section could not be generated. See the nvidia-scan-transcript artifact for details._"
              } >> "$ASSESSMENT_REPORT"
            fi
          done

          cp "$SECTION_LOG" .claude/reports/nvidia-scan-transcript.log || true
          echo "Wrote $ASSESSMENT_REPORT ($REPORT_BYTES bytes). Job always completes — see warnings above for any degraded sections."

      - name: Upload nvidia-scan transcript
        if: always() && hashFiles('.claude/reports/nvidia-scan-transcript.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-scan-transcript
          path: .claude/reports/nvidia-scan-transcript.log
          retention-days: 30

      - name: Upload security assessment report
        if: always() && hashFiles(env.ASSESSMENT_REPORT) != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-assessment-report
          path: ${{ env.ASSESSMENT_REPORT }}
          retention-days: 90

      - name: Stage assessment working-tree changes
        run: |
          set -euo pipefail
          git add -A
          git add -f "$ASSESSMENT_REPORT" 2>/dev/null || true
          git status --short
          echo "---"
          git diff --cached --stat | tail -n 20

      - name: nvidia-push
        id: nvidia_push
        env:
          CHAIN_PREFIX: nvdia_trials
          DEVELOPMENT_BRANCH: nvdia_trials
        run: |
          set -euo pipefail

          if [ ! -s "$ASSESSMENT_REPORT" ]; then
            echo "::error::Assessment report missing or empty: $ASSESSMENT_REPORT. Aborting push."
            exit 1
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit. Skipping push."
            echo "skipped" > "$PUSH_REPORT"
            exit 0
          fi

          REMOTE_REFS=$(git ls-remote --heads origin "${CHAIN_PREFIX}_*" 2>/dev/null || true)
          LOCAL_BRANCHES=$(git branch --list "${CHAIN_PREFIX}_*" || true)
          MAX_N=0
          PARENT="${DEVELOPMENT_BRANCH}"
          for ref in $REMOTE_REFS $LOCAL_BRANCHES; do
            ref=${ref##*/}
            n=$(printf '%s' "$ref" | sed -nE "s/^${CHAIN_PREFIX//\//\\/}_([0-9]+)_.*/\1/p")
            if [ -n "$n" ] && [ "$n" -gt "$MAX_N" ]; then
              MAX_N=$n
              PARENT="$ref"
            fi
          done
          NEW_N=$((MAX_N + 1))

          TS=$(date +%Y-%m-%d_%H-%M-%S)
          if [ -z "$TS" ] || printf '%s' "$TS" | grep -q 'time_of_push'; then
            echo "::error::Timestamp step failed (contains literal 'time_of_push'). Aborting."
            exit 1
          fi
          NEW_BRANCH="${CHAIN_PREFIX}_${NEW_N}_${TS}"

          BRANCH_REGEX="^${CHAIN_PREFIX//\//\\/}_[0-9]+_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}$"
          if ! printf '%s' "$NEW_BRANCH" | grep -qE "$BRANCH_REGEX"; then
            echo "::error::Computed branch '$NEW_BRANCH' does not match the required format."
            exit 1
          fi

          CHANGES_SUMMARY=$(awk '
              /^# Findings/{flag=1; next}
              /^# Executive Summary/{ if (!flag) flag=1; next }
              /^# /{flag=0}
              flag && NF{print}
            ' "$ASSESSMENT_REPORT" \
            | sed -nE 's/^[[:space:]]*[-*][[:space:]]*//p' \
            | head -n 8 \
            | sed 's/[\"]/\\&/g' \
            | paste -sd '|' -)
          if [ -z "$CHANGES_SUMMARY" ]; then
            CHANGES_SUMMARY="automated security scan"
          fi
          BULLETS=$(printf '%s' "$CHANGES_SUMMARY" | tr '|' '\n' | sed 's/^/- /' | paste -sd '\n' -)

          SUBJECT="NVIDIA git-agent push #${NEW_N} — security scan report"
          if [ "${#SUBJECT}" -gt 72 ]; then
            SUBJECT="NVIDIA git-agent push #${NEW_N} — scan report"
          fi

          COMMIT_MSG=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n\n%s\n' \
            "$SUBJECT" \
            "$BULLETS" \
            "Source: SECURITY_ASSESSMENT_REPORT.md (no code changes — remediation agent removed)" \
            "Parent branch: ${PARENT}" \
            "Manual merge target: ${DEVELOPMENT_BRANCH} (then main, human review required)" \
            "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>")

          echo "Computed push: branch=${NEW_BRANCH} parent=${PARENT} N=${NEW_N} ts=${TS}"

          if [ "$PARENT" != "${DEVELOPMENT_BRANCH}" ]; then
            git fetch origin "$PARENT" 2>/dev/null || true
          else
            git fetch origin "${DEVELOPMENT_BRANCH}" 2>/dev/null || true
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "github-actions-temp"
          git checkout "$PARENT"
          git checkout -b "$NEW_BRANCH"
          git stash pop || true
          git add -A
          git add -f "$ASSESSMENT_REPORT" 2>/dev/null || true

          MSG_FILE=$(mktemp)
          printf '%s' "$COMMIT_MSG" > "$MSG_FILE"
          git commit -F "$MSG_FILE"

          PUSH_OUT=$(git push -u origin "$NEW_BRANCH" 2>&1)
          PUSH_RC=$?
          if [ "$PUSH_RC" -ne 0 ]; then
            echo "::error::git push failed (rc=$PUSH_RC):"
            echo "$PUSH_OUT"
            git checkout "$PARENT"
            git branch -D "$NEW_BRANCH"
            exit 1
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          REMOTE_URL=$(git remote get-url origin)
          git checkout "$PARENT"

          {
            echo "# Git Push Report — NVIDIA git-agent Push #${NEW_N}"
            echo
            echo "- **Development branch:** \`${DEVELOPMENT_BRANCH}\`"
            echo "- **Parent branch:** \`${PARENT}\`"
            echo "- **Push branch:** \`${NEW_BRANCH}\`"
            echo "- **Push time:** ${TS}"
            echo "- **Remote:** origin (${REMOTE_URL})"
            echo "- **Commit:** ${COMMIT_SHA}"
            echo "- **Code changes:** none (remediation agent removed; only the assessment report is committed)"
            echo
            echo "## Files Pushed"
            echo
            git show --stat --name-only --format="" "$COMMIT_SHA" | sed 's/^/- /'
          } > "$PUSH_REPORT"

          echo "Pushed: $NEW_BRANCH @ $COMMIT_SHA"
          echo "branch=${NEW_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT_SHA}"   >> "$GITHUB_OUTPUT"

      - name: Upload git push report
        if: always() && hashFiles(env.PUSH_REPORT) != ''
        uses: actions/upload-artifact@v4
        with:
          name: git-push-report
          path: ${{ env.PUSH_REPORT }}
          retention-days: 90

      - name: Commit assessment report back to trigger branch
        if: always() && hashFiles(env.ASSESSMENT_REPORT) != ''
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TRIGGER_BRANCH="${GITHUB_REF_NAME}"
          if [ -z "$TRIGGER_BRANCH" ] || [ "$TRIGGER_BRANCH" = "null" ]; then
            echo "::error::GITHUB_REF_NAME is empty — cannot determine trigger branch."
            exit 1
          fi

          case "$TRIGGER_BRANCH" in
            nvdia_trials_[0-9]*_*)
              echo "::error::Refusing to push report updates to a chain step branch: $TRIGGER_BRANCH"
              exit 1
              ;;
            feature/safe-backup_[0-9]*_*)
              echo "::error::Refusing to push report updates to a chain step branch: $TRIGGER_BRANCH"
              exit 1
              ;;
          esac

          git fetch origin "$TRIGGER_BRANCH" 2>/dev/null || true
          git checkout "$TRIGGER_BRANCH"

          git add -f "$ASSESSMENT_REPORT"
          if git diff --cached --quiet; then
            echo "No report changes to commit on $TRIGGER_BRANCH."
          else
            git commit -m "chore(security): refresh SECURITY_ASSESSMENT_REPORT.md [skip ci]"
            git push origin "$TRIGGER_BRANCH"
          fi