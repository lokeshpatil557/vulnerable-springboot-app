name: Build & Security (NVIDIA CI pipeline)

# Trigger only on the development branch while the pipeline is being built.
# Once the pipeline stabilises, broaden to feature/safe-backup* + master
# so every chain step is cut from the previous tip.
on:
  push:
    branches:
      - nvdia_trials
  pull_request:
    branches:
      - nvdia_trials
  workflow_dispatch:

# Workflow-wide defaults. Per-job permissions override these.
permissions:
  contents: write

# ---- NVIDIA endpoint configuration ----
# To use a different model, change NVIDIA_MODEL below. Common
# build.nvidia.com slugs (any of these will work as long as your
# NVIDIA_API_KEY has access to them):
#   meta/llama-3.1-70b-instruct
#   mistralai/mistral-large-2-instruct
#   nvidia/nemotron-4-340b-instruct
# To use a different endpoint (e.g. self-hosted NIM), change
# NVIDIA_BASE_URL below.
env:
  NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1/chat/completions
  NVIDIA_MODEL: meta/llama-3.1-70b-instruct
  NVIDIA_TEMPERATURE: "0.0"
  NVIDIA_MAX_TOKENS: "8192"

jobs:
  # ---------------------------------------------------------------
  # 1. Build — unchanged from the previous workflow.
  # ---------------------------------------------------------------
  build:
    name: Build (Maven)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & test (skip tests on this intentionally insecure lab)
        run: mvn -B -ntp -DskipTests package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. Security — three NVIDIA-driven agents + gitleaks.
  #    Gated on build green.
  # ---------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      # Make the .claude/reports dir exist before any job runs
      # (the dir is gitignored, the assessment report is tracked).
      # Remediation agent removed: only the assessment report and the
      # git-push report are produced now.
      REPORTS_DIR: .claude/reports
      ASSESSMENT_REPORT: .claude/reports/SECURITY_ASSESSMENT_REPORT.md
      PUSH_REPORT: .claude/reports/GIT_PUSH_REPORT.md

    steps:
      # -----------------------------------------------------------
      # 2a. Checkout the source so the agents have something to scan.
      #     fetch-depth: 0 is required so gitleaks-action@v2 can resolve
      #     the rev-walk it builds on push events (it references the
      #     parent of the merge base — e.g. c016eee2bc...^ — which a
      #     shallow clone does not have). Without this the scan fails
      #     with: fatal: unknown revision or path not in the working tree.
      # -----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ensure reports dir exists
        run: mkdir -p "$REPORTS_DIR"

      # -----------------------------------------------------------
      # 2b. Secret scanning — unchanged.
      # -----------------------------------------------------------
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------
      # 2c. Helper — POST a system + user message to NVIDIA and
      #     print the assistant's reply to stdout. Defined once, used
      #     by all three agent jobs. Reads NVIDIA_API_KEY from the
      #     repo secret.
      # -----------------------------------------------------------
      - name: Install curl + jq (already on ubuntu-latest, but be explicit)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq >/dev/null
          curl --version | head -n1
          jq --version

      # -----------------------------------------------------------
      # 2d. NVIDIA vulnerability scanner — multi-request orchestrator.
      #
      #   Llama-3.1-70B on the free build.nvidia.com tier caps output at
      #   16,384 tokens per request, but the scanner spec demands a long
      #   report that frequently exceeds 8k tokens of output. We solve
      #   this by issuing one API call per report section and stitching
      #   the results together. Sections, in order:
      #
      #     1. Executive Summary
      #     2. Risk Matrix
      #     3. Vulnerability Findings  (the longest section — chunked
      #        further if it exceeds the per-request output budget)
      #     4. OWASP Top 10 Mapping
      #     5. CWE Mapping
      #     6. Priority Remediation Roadmap
      #
      #   Each call gets:
      #     - the full repo file dump (one consolidated input payload
      #       built once, reused across calls)
      #     - a tight system prompt that names the section + output shape
      #     - max_tokens = NVIDIA_MAX_TOKENS (8192) so the model can
      #       always finish the section without hitting the cap
      #
      #   The workflow extracts each fenced block, appends to the
      #   report, and validates the report is non-empty + contains
      #   "# Executive Summary" before the next steps run.
      # -----------------------------------------------------------
      - name: nvidia-scan
        id: nvidia_scan
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SYSTEM_PROMPT_FILE: .claude/agents/nvidia-vulnerability-scanner.md
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::error::NVIDIA_API_KEY repository secret is not set."
            echo "Please add NVIDIA_API_KEY to your repository secrets."
            exit 1
          fi

          # ------------------------------------------------------------
          # 1. Build the shared input payload once: a curated set of
          #    files (the ones most likely to contain security findings)
          #    plus a tree. We do NOT ship every Java/HTML/yml file
          #    verbatim anymore — that ate the context window and gave
          #    the model no room to write the report. We DO ship the
          #    high-signal files: security config, controllers, repos,
          #    any file mentioned in pom.xml's dependencies, and the
          #    application config.
          # ------------------------------------------------------------
          USER_PAYLOAD=$(mktemp)
          {
            echo "## Repository tree (paths only, capped at 400 entries)"
            (find . -type f \
              -not -path './target/*' \
              -not -path './.git/*' \
              -not -path './.claude/reports/*' \
              -not -path './node_modules/*' \
              | sort | head -n 400) || true
            echo
            echo "## File contents (curated — high-signal files only)"
            # Files most likely to contain findings. 16k-byte cap per
            # file keeps the payload bounded; we never hit a 80kB
            # spring-boot config in this lab.
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              [ ! -f "$f" ] && continue
              size=$(wc -c < "$f" 2>/dev/null || echo 0)
              echo
              echo "### $f (${size} bytes)"
              if [ "$size" -gt 16000 ]; then
                head -c 16000 "$f"
                echo
                echo "...FILE TRUNCATED at 16000 bytes..."
              else
                cat "$f"
              fi
            done < <(
              # pom.xml first — always include.
              printf '%s\n' pom.xml
              # application*.{yml,yaml,properties}
              find src/main/resources -type f \
                \( -name 'application*.yml' \
                   -o -name 'application*.yaml' \
                   -o -name 'application*.properties' \) 2>/dev/null || true
              # Security config + filters + auth-related classes.
              find src -type f -name '*.java' \
                \( -iname '*Security*' \
                   -o -iname '*Auth*' \
                   -o -iname '*Filter*' \
                   -o -iname '*Config*' \
                   -o -iname '*Cors*' \
                   -o -iname '*Web*' \
                   -o -iname '*User*' \
                   -o -iname '*Login*' \
                   -o -iname '*Token*' \
                   -o -iname '*Jwt*' \) 2>/dev/null || true
              # All controllers, services, repositories — the main attack
              # surface for a Spring Boot app.
              find src -type f -name '*.java' \
                \( -path '*/controller/*' -o -path '*/controllers/*' \
                   -o -path '*/service/*' -o -path '*/services/*' \
                   -o -path '*/repository/*' -o -path '*/repositories/*' \
                   -o -path '*/dao/*' \
                   -o -path '*/model/*' -o -path '*/entity/*' \
                   -o -path '*/dto/*' -o -path '*/util/*' -o -path '*/utils/*' \) 2>/dev/null || true
              # Anything that looks like a JSP/Thymeleaf template.
              find src -type f \
                \( -name '*.html' -o -name '*.jsp' -o -name '*.tpl' \) 2>/dev/null || true
              | sort -u
            )
          } > "$USER_PAYLOAD"

          SYSTEM_PROMPT=$(cat "$SYSTEM_PROMPT_FILE")

          echo "=== NVIDIA SCAN: Preparing request ==="
          echo "Payload size: $(wc -c < "$USER_PAYLOAD") bytes"
          echo "System prompt file: $SYSTEM_PROMPT_FILE"
          echo "Model: $NVIDIA_MODEL"
          echo "Endpoint: $NVIDIA_BASE_URL"
          echo "Max tokens per request: $NVIDIA_MAX_TOKENS"

          # ------------------------------------------------------------
          # 2. Helper: do_one_section <section-id> <section-prompt>
          #
          #    Issues one API call. The system prompt + payload are
          #    identical across calls; only the user-message tail
          #    (the "section prompt") changes. The assistant's reply
          #    is expected to be a single fenced ```markdown``` block
          #    containing JUST that section. The function extracts the
          #    block, strips the leading "# <Section Name>" header so
          #    we don't double-print it, and appends to the report.
          #
          #    Returns 0 on success, 1 on failure (logged + aborts).
          # ------------------------------------------------------------
          do_one_section() {
            local section_id="$1"
            local section_prompt="$2"
            local section_file="$3"   # the file to append into
            local section_log="$4"    # log file for this section's transcript

            echo "--- nvidia-scan: requesting section '$section_id' ---"

            # Build the per-section user message: payload + a tight
            # instruction asking for ONLY this section.
            local USER_MSG
            USER_MSG=$(cat "$USER_PAYLOAD")
            USER_MSG="${USER_MSG}

---

## Section to produce NOW: ${section_id}

${section_prompt}

Emit ONLY this section, formatted as a single Markdown fenced code block:

\`\`\`markdown
...this section's content, with its '# <Section Name>' header...
\`\`\`

No other sections. No preamble. No postamble. Stop after the closing fence."

            local REQUEST_BODY
            REQUEST_BODY=$(jq -n \
              --arg model  "$NVIDIA_MODEL" \
              --arg sys    "$SYSTEM_PROMPT" \
              --arg user   "$USER_MSG" \
              --argjson temp  "$NVIDIA_TEMPERATURE" \
              --argjson mtok "$NVIDIA_MAX_TOKENS" \
              '{model: $model, temperature: $temp, max_tokens: $mtok,
                messages: [
                  {role: "system", content: $sys},
                  {role: "user",   content: $user}
                ]}')

            local RESPONSE_FILE
            RESPONSE_FILE=$(mktemp)
            local HTTP_CODE
            HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
              -H "Authorization: Bearer $NVIDIA_API_KEY" \
              -H "Content-Type: application/json" \
              --connect-timeout 60 \
              --max-time 1200 \
              --retry 5 \
              --retry-delay 15 \
              --retry-all-errors \
              --retry-max-time 900 \
              -X POST "$NVIDIA_BASE_URL" \
              -d "$REQUEST_BODY" || echo "000")

            echo "[$section_id] HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::[$section_id] NVIDIA scan HTTP $HTTP_CODE (expected 200)"
              echo "=== Response ==="
              cat "$RESPONSE_FILE" || true
              echo "=== End ==="
              rm -f "$RESPONSE_FILE"
              return 1
            fi

            local ASSISTANT
            ASSISTANT=$(jq -r '.choices[0].message.content // ""' "$RESPONSE_FILE")
            rm -f "$RESPONSE_FILE"
            if [ -z "$ASSISTANT" ]; then
              echo "::error::[$section_id] NVIDIA scan returned empty assistant content."
              return 1
            fi

            # Log full transcript for debugging.
            {
              echo "=== Section: $section_id ==="
              echo "--- USER PROMPT TAIL ---"
              printf '%s\n' "$section_prompt"
              echo "--- ASSISTANT REPLY (raw, first 4000 chars) ---"
              printf '%s\n' "$ASSISTANT" | head -c 4000
              echo
              echo "--- END ---"
            } >> "$section_log"

            # Extract the fenced block. Try ```markdown first, then
            # plain ```. If neither is present, treat the whole
            # assistant message as the section content (so the model
            # can still succeed even if it forgets the info string).
            local BLOCK
            BLOCK=$(printf '%s\n' "$ASSISTANT" \
              | awk '
                  /^```markdown/{ if (!in_block) {in_block=1; next} else {in_block=0; exit} }
                  /^```/{        if (!in_block && !tried_md) {tried_md=1; in_block=1; next}
                                  else if (in_block) {in_block=0; exit} }
                  in_block {print}
                ')

            if [ -z "$BLOCK" ]; then
              # Fallback: no fenced block at all. Accept the raw text.
              echo "::warning::[$section_id] no fenced block found; using raw assistant content."
              BLOCK=$(printf '%s\n' "$ASSISTANT")
            fi

            # Append to the report. We DON'T strip the "# Section"
            # header — we want every section to be self-contained
            # when concatenated, and the table of contents at the
            # top of the report makes the headers useful.
            {
              echo
              echo "<!-- BEGIN SECTION: $section_id -->"
              printf '%s\n' "$BLOCK"
              echo "<!-- END SECTION: $section_id -->"
              echo
            } >> "$section_file"

            echo "[$section_id] appended $(printf '%s' "$BLOCK" | wc -c) bytes"
            return 0
          }

          # ------------------------------------------------------------
          # 3. Issue one call per section. Each section prompt is
          #    intentionally narrow so the model doesn't burn its
          #    output budget re-emitting the whole report.
          # ------------------------------------------------------------
          REPORT_PARTS=$(mktemp)
          SECTION_LOG=$(mktemp)

          # Section 1: Executive Summary
          do_one_section "Executive Summary" \
            "Produce the '# Executive Summary' section of SECURITY_ASSESSMENT_REPORT.md for this codebase. Cover: (a) the scope of the review (which files/areas you examined), (b) the methodology used (the check categories from your system prompt that you actually applied), (c) the top-line risk posture (one paragraph), and (d) a count of findings by severity (Critical/High/Medium/Low). Do NOT list individual findings here — that comes in the next section." \
            "$REPORT_PARTS" "$SECTION_LOG" || exit 1

          # Section 2: Risk Matrix
          do_one_section "Risk Matrix" \
            "Produce ONLY the '# Risk Matrix' section: a single Markdown table with columns 'Severity' and 'Likelihood', and rows for each combination (Critical/High/Medium/Low × High/Medium/Low). For each cell, give the count of findings that fall into that bucket based on your analysis of the input. Below the table, add one sentence explaining the methodology (e.g. severity = business impact, likelihood = exploitability given the current configuration)." \
            "$REPORT_PARTS" "$SECTION_LOG" || exit 1

          # Section 3: Vulnerability Findings (the big one)
          do_one_section "Vulnerability Findings" \
            "Produce ONLY the '# Vulnerability Findings' section. For EACH finding use this exact schema:

### VULN-<NNN> — <Vulnerability Name>

- **CWE:** CWE-<id>
- **OWASP Top 10:** <category, e.g. A01:2021 - Broken Access Control>
- **Severity:** Critical | High | Medium | Low
- **Affected File:** \`<repo-relative path>\`
- **Affected Method / Class:** \`<name>\`
- **Vulnerable Code:**
  \`\`\`java
  <verbatim snippet — copy-paste from the input>
  \`\`\`
- **Root Cause:** <one sentence>
- **Exploitation Scenario:** <one paragraph>
- **Business Impact:** <one paragraph>
- **Confidence:** High | Medium | Low

Order findings Critical → High → Medium → Low. If a check category yields no findings, you may omit it. Do NOT include any other section in your reply — just the findings, one after another, in the schema above." \
            "$REPORT_PARTS" "$SECTION_LOG" || exit 1

          # Section 4: OWASP Top 10 Mapping
          do_one_section "OWASP Top 10 Mapping" \
            "Produce ONLY the '# OWASP Top 10 Mapping' section: for each OWASP Top 10 2021 category that has at least one finding in this codebase, list the category name and the VULN-IDs that map to it. Use a Markdown table or a per-category sub-list. Categories with zero findings may be omitted. Do NOT include any other section." \
            "$REPORT_PARTS" "$SECTION_LOG" || exit 1

          # Section 5: CWE Mapping
          do_one_section "CWE Mapping" \
            "Produce ONLY the '# CWE Mapping' section: for each CWE that has at least one finding, list the CWE ID + name and the VULN-IDs that map to it. Use a Markdown table. CWEs with zero findings may be omitted. Do NOT include any other section." \
            "$REPORT_PARTS" "$SECTION_LOG" || exit 1

          # Section 6: Priority Remediation Roadmap
          do_one_section "Priority Remediation Roadmap" \
            "Produce ONLY the '# Priority Remediation Roadmap' section: an ordered list (Critical → Low) of concrete remediation steps, one per VULN-ID, with a 1-3 sentence fix recommendation each. End with a '## Next Steps' sub-section listing the top 3 actions the developer should take first. Do NOT include any other section." \
            "$REPORT_PARTS" "$SECTION_LOG" || exit 1

          # ------------------------------------------------------------
          # 4. Stitch the sections into the final report. Add a title
          #    and a table of contents at the top so the report is
          #    self-contained.
          # ------------------------------------------------------------
          {
            echo "# SECURITY ASSESSMENT REPORT"
            echo
            echo "_Generated by the NVIDIA vulnerability scanner on $(date -u +%Y-%m-%dT%H:%M:%SZ)._"
            echo "_Model: ${NVIDIA_MODEL} (build.nvidia.com)._"
            echo
            echo "## Contents"
            echo
            echo "1. [Executive Summary](#executive-summary)"
            echo "2. [Risk Matrix](#risk-matrix)"
            echo "3. [Vulnerability Findings](#vulnerability-findings)"
            echo "4. [OWASP Top 10 Mapping](#owasp-top-10-mapping)"
            echo "5. [CWE Mapping](#cwe-mapping)"
            echo "6. [Priority Remediation Roadmap](#priority-remediation-roadmap)"
            echo
            cat "$REPORT_PARTS"
          } > "$ASSESSMENT_REPORT"

          REPORT_BYTES=$(wc -c < "$ASSESSMENT_REPORT")
          echo "=== NVIDIA SCAN: report assembled ==="
          echo "Report size: $REPORT_BYTES bytes"
          echo "Section transcript: $SECTION_LOG"

          # Validate: must be non-empty and contain the sentinel.
          if [ "$REPORT_BYTES" -lt 200 ]; then
            echo "::error::Assessment report suspiciously small ($REPORT_BYTES bytes). Aborting."
            exit 1
          fi
          if ! grep -q "# Executive Summary" "$ASSESSMENT_REPORT"; then
            echo "::error::Assessment report missing # Executive Summary header."
            echo "--- first 1000 chars ---"
            head -c 1000 "$ASSESSMENT_REPORT"
            echo
            exit 1
          fi

          # Also upload the section transcript for debugging — it
          # contains the per-section transcripts, which makes
          # diagnosing model behavior much easier.
          cp "$SECTION_LOG" .claude/reports/nvidia-scan-transcript.log || true

          echo "Wrote $ASSESSMENT_REPORT ($REPORT_BYTES bytes)."

      - name: Upload nvidia-scan transcript
        if: always() && hashFiles('.claude/reports/nvidia-scan-transcript.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-scan-transcript
          path: .claude/reports/nvidia-scan-transcript.log
          retention-days: 30

      - name: Upload security assessment report
        if: always() && hashFiles(env.ASSESSMENT_REPORT) != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-assessment-report
          path: ${{ env.ASSESSMENT_REPORT }}
          retention-days: 90

      # -----------------------------------------------------------
      # 2e. (removed) NVIDIA remediation agent.
      #     Previously: read assessment report, ask NVIDIA for patches,
      #     apply them, run gate A (mvn compile test-compile), revert
      #     on failure, write SECURE_REMEDIATION_REPORT.md.
      #     Removed per pipeline change: the scanner is the only
      #     model-driven step. The git-agent only commits the report
      #     and pushes a chain step — it does not change source code.
      # -----------------------------------------------------------

      - name: Stage assessment working-tree changes
        # Always stage — git-agent will decide whether there is something to push.
        run: |
          set -euo pipefail
          git add -A
          # Force-add the tracked report (its dir is otherwise ignored).
          git add -f "$ASSESSMENT_REPORT" 2>/dev/null || true
          git status --short
          echo "---"
          git diff --cached --stat | tail -n 20

      # -----------------------------------------------------------
      # 2f. NVIDIA push — creates a per-development-branch chain step.
      #     Branch family: nvdia_trials_<N>_<TIMESTAMP>.
      #     The parent of push #N is the previous push #(N-1)'s tip
      #     (i.e. the tip of nvdia_trials_<MAX_N>_*), or
      #     the development branch nvdia_trials itself if
      #     no numbered push exists yet.
      #     The push step itself is model-free — the scanner is the
      #     only place the model is used now.
      # -----------------------------------------------------------
      - name: nvidia-push
        id: nvidia_push
        env:
          # Family prefix for the chain steps created by this workflow.
          # Change this if the development branch is renamed.
          CHAIN_PREFIX: nvdia_trials
          # Development branch the chain hangs off (parent of push #1).
          DEVELOPMENT_BRANCH: nvdia_trials
        run: |
          set -euo pipefail

          # ---- Pre-flight: assessment report must exist and be non-empty ----
          if [ ! -s "$ASSESSMENT_REPORT" ]; then
            echo "::error::Assessment report missing or empty: $ASSESSMENT_REPORT. Aborting push."
            exit 1
          fi

          # ---- Pre-flight: something to commit ----
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit. Skipping push."
            echo "skipped" > "$PUSH_REPORT"
            exit 0
          fi

          # ---- Compute max N from remote + local, scoped to the chain family ----
          REMOTE_REFS=$(git ls-remote --heads origin "${CHAIN_PREFIX}_*" 2>/dev/null || true)
          LOCAL_BRANCHES=$(git branch --list "${CHAIN_PREFIX}_*" || true)
          MAX_N=0
          PARENT="${DEVELOPMENT_BRANCH}"
          for ref in $REMOTE_REFS $LOCAL_BRANCHES; do
            ref=${ref##*/}            # strip origin/ if present
            n=$(printf '%s' "$ref" | sed -nE "s/^${CHAIN_PREFIX//\//\\/}_([0-9]+)_.*/\1/p")
            if [ -n "$n" ] && [ "$n" -gt "$MAX_N" ]; then
              MAX_N=$n
              PARENT="$ref"
            fi
          done
          NEW_N=$((MAX_N + 1))

          # ---- Workflow-supplied timestamp (source of truth) ----
          TS=$(date +%Y-%m-%d_%H-%M-%S)
          if [ -z "$TS" ] || printf '%s' "$TS" | grep -q 'time_of_push'; then
            echo "::error::Timestamp step failed (contains literal 'time_of_push'). Aborting."
            exit 1
          fi
          NEW_BRANCH="${CHAIN_PREFIX}_${NEW_N}_${TS}"

          # ---- Branch-name hard-rule validation (workflow is the source of truth) ----
          BRANCH_REGEX="^${CHAIN_PREFIX//\//\\/}_[0-9]+_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}$"
          if ! printf '%s' "$NEW_BRANCH" | grep -qE "$BRANCH_REGEX"; then
            echo "::error::Computed branch '$NEW_BRANCH' does not match the required format."
            exit 1
          fi

          # ---- Build the commit message from the assessment report ----
          # Pull up to 8 bullet lines out of "# Findings" to use as the body.
          # The scanner agent uses "# Findings" (or "# Executive Summary" for
          # older versions) — we try Findings first, fall back to Exec Summary.
          CHANGES_SUMMARY=$(awk '
              /^# Findings/{flag=1; next}
              /^# Executive Summary/{ if (!flag) flag=1; next }
              /^# /{flag=0}
              flag && NF{print}
            ' "$ASSESSMENT_REPORT" \
            | sed -nE 's/^[[:space:]]*[-*][[:space:]]*//p' \
            | head -n 8 \
            | sed 's/[\"]/\\&/g' \
            | paste -sd '|' -)
          if [ -z "$CHANGES_SUMMARY" ]; then
            CHANGES_SUMMARY="automated security scan"
          fi
          BULLETS=$(printf '%s' "$CHANGES_SUMMARY" | tr '|' '\n' | sed 's/^/- /' | paste -sd '\n' -)

          # Subject line: keep under 72 chars.
          SUBJECT="NVIDIA git-agent push #${NEW_N} — security scan report"
          if [ "${#SUBJECT}" -gt 72 ]; then
            SUBJECT="NVIDIA git-agent push #${NEW_N} — scan report"
          fi

          COMMIT_MSG=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n\n%s\n' \
            "$SUBJECT" \
            "$BULLETS" \
            "Source: SECURITY_ASSESSMENT_REPORT.md (no code changes — remediation agent removed)" \
            "Parent branch: ${PARENT}" \
            "Manual merge target: ${DEVELOPMENT_BRANCH} (then main, human review required)" \
            "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>")

          # ---- Final pre-flight ----
          echo "Computed push: branch=${NEW_BRANCH} parent=${PARENT} N=${NEW_N} ts=${TS}"

          # Make sure the parent is fetched (in case it's only on the remote).
          if [ "$PARENT" != "${DEVELOPMENT_BRANCH}" ]; then
            git fetch origin "$PARENT" 2>/dev/null || true
          else
            # First push — make sure the development branch itself is up to date.
            git fetch origin "${DEVELOPMENT_BRANCH}" 2>/dev/null || true
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "github-actions-temp"
          git checkout "$PARENT"
          git checkout -b "$NEW_BRANCH"
          git stash pop || true
          # Re-stage on the new branch (working tree carries over, but be safe).
          git add -A
          git add -f "$ASSESSMENT_REPORT" 2>/dev/null || true

          # Commit (use a temp file for the message to preserve newlines exactly).
          MSG_FILE=$(mktemp)
          printf '%s' "$COMMIT_MSG" > "$MSG_FILE"
          git commit -F "$MSG_FILE"

          PUSH_OUT=$(git push -u origin "$NEW_BRANCH" 2>&1)
          PUSH_RC=$?
          if [ "$PUSH_RC" -ne 0 ]; then
            echo "::error::git push failed (rc=$PUSH_RC):"
            echo "$PUSH_OUT"
            git checkout "$PARENT"
            git branch -D "$NEW_BRANCH"
            exit 1
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          REMOTE_URL=$(git remote get-url origin)

          # Switch back to the parent so the runner is in a clean state.
          git checkout "$PARENT"

          # Write the push report.
          {
            echo "# Git Push Report — NVIDIA git-agent Push #${NEW_N}"
            echo
            echo "- **Development branch:** \`${DEVELOPMENT_BRANCH}\`"
            echo "- **Parent branch:** \`${PARENT}\`"
            echo "- **Push branch:** \`${NEW_BRANCH}\`"
            echo "- **Push time:** ${TS} (workflow-computed; literal 'time_of_push' is a hard-fail)"
            echo "- **Remote:** origin (${REMOTE_URL})"
            echo "- **Commit:** ${COMMIT_SHA}"
            echo "- **Code changes:** none (remediation agent removed; only the assessment report is committed)"
            echo "- **Chain step decision:** workflow-computed (no model in the push step)"
            echo
            echo "## Files Pushed"
            echo
            git show --stat --name-only --format="" "$COMMIT_SHA" | sed 's/^/- /'
            echo
            echo "## Notes"
            echo
            echo "- The push branch is named with an incrementing counter so the"
            echo "  developer always knows which push is the latest."
            echo "- This push is a chain step of the development branch"
            echo "  \`${DEVELOPMENT_BRANCH}\`; its parent is the previous push's"
            echo "  tip (or the development branch itself for push #1). The chain is:"
            echo "  \`${DEVELOPMENT_BRANCH}\` → ... → \`${PARENT}\` → \`${NEW_BRANCH}\`."
            echo "- Run \`git fetch origin\` locally and inspect"
            echo "  \`${NEW_BRANCH}\` before merging."
            echo "- Only the NVIDIA scanner agent (${NVIDIA_MODEL} via"
            echo "  ${NVIDIA_BASE_URL}) ran in this pipeline. The remediation"
            echo "  agent has been removed; no source code was modified. The"
            echo "  assessment report describes the vulnerabilities found;"
            echo "  remediation is left to the developer."
          } > "$PUSH_REPORT"

          echo "Pushed: $NEW_BRANCH @ $COMMIT_SHA"
          echo "branch=${NEW_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT_SHA}"   >> "$GITHUB_OUTPUT"

      - name: Upload git push report
        if: always() && hashFiles(env.PUSH_REPORT) != ''
        uses: actions/upload-artifact@v4
        with:
          name: git-push-report
          path: ${{ env.PUSH_REPORT }}
          retention-days: 90

      # -----------------------------------------------------------
      # 2g. Commit the assessment report back to the original
      #     trigger branch (the branch the workflow was launched
      #     from), not to the parent chain step we just created.
      #     The chain step itself was already pushed in 2f.
      #     We switch to ${GITHUB_REF_NAME} (the trigger branch)
      #     so the report lands where the developer is looking.
      # -----------------------------------------------------------
      - name: Commit assessment report back to trigger branch
        if: always() && hashFiles(env.ASSESSMENT_REPORT) != ''
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Recover the original trigger branch. After nvidia-push the
          # runner is checked out on the parent chain step, so we have
          # to switch back to the branch the workflow was launched from.
          TRIGGER_BRANCH="${GITHUB_REF_NAME}"
          if [ -z "$TRIGGER_BRANCH" ] || [ "$TRIGGER_BRANCH" = "null" ]; then
            echo "::error::GITHUB_REF_NAME is empty — cannot determine trigger branch."
            exit 1
          fi

          # Sanity: never push report updates to a chain step. The chain
          # step is always `${CHAIN_PREFIX}_<N>_<TS>` (e.g. nvdia_trials_1_…)
          # — we must not accidentally commit reports there. Reports
          # belong on the development branch (the trigger).
          case "$TRIGGER_BRANCH" in
            nvdia_trials_[0-9]*_*)
              echo "::error::Refusing to push report updates to a chain step branch: $TRIGGER_BRANCH"
              exit 1
              ;;
            feature/safe-backup_[0-9]*_*)
              echo "::error::Refusing to push report updates to a chain step branch: $TRIGGER_BRANCH"
              exit 1
              ;;
          esac

          git fetch origin "$TRIGGER_BRANCH" 2>/dev/null || true
          git checkout "$TRIGGER_BRANCH"

          git add -f "$ASSESSMENT_REPORT"
          if git diff --cached --quiet; then
            echo "No report changes to commit on $TRIGGER_BRANCH."
          else
            git commit -m "chore(security): refresh SECURITY_ASSESSMENT_REPORT.md [skip ci]"
            git push origin "$TRIGGER_BRANCH"
          fi
